name = "tarpovizyon-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# AI ucu için hız sınırı.
#
# ─── NEDEN BINDING, NEDEN ELDE SAYAÇ DEĞİL ───────────────────────────────────
# Önce sayaç Worker belleğinde (module-scope Map) tutuluyordu. YERELDE
# çalışıyordu ama CANLIDA hiç tetiklenmedi: 16 ardışık istek ölçüldü, hiçbiri
# 429 almadı — Cloudflare istekleri farklı isolate'lara dağıttığı için her
# istek boş bir sayaca düşüyordu. Yani koruma sadece kâğıt üstündeydi.
#
# `ratelimits` bindingi sayacı çalışma zamanına devrediyor; aynı Cloudflare
# konumundaki TÜM isolate'lar aynı sayacı görüyor. (Sınır konum başına;
# küresel tek bir kota değil — bu uç için fazlasıyla yeterli.)
# ── Okuma uçları ────────────────────────────────────────────────────────
# AI'dan AYRI sayaç: AI çağrısı para, okuma çağrısı D1 satırı demek. Aynı
# sayacı paylaşsalardı sayfa gezen sıradan kullanıcı asistanın hakkını yerdi.
# Eşik yüksek çünkü bir sayfa açılışı birkaç uç birden çağırabiliyor;
# amaç kullanıcıyı değil kazımayı durdurmak.
[[ratelimits]]
name = "OKUMA_LIMIT"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "AI_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  # `period` yalnızca 10 veya 60 olabilir.
  limit = 12
  period = 60

# Türkiye verileri (TÜİK, sektör tabloları, il düzeyi)
[[d1_databases]]
binding = "DB"
database_name = "tarpovizyon-basic"
database_id = "86c5e73d-ad8a-45ec-b4e9-1c9c2b890709"

# Dünya/FAO referans verileri — ayrı veritabanı: FAO seti ~450MB, aynı
# veritabanına konsa Türkiye verisiyle birlikte tek DB limitini zorlar.
[[d1_databases]]
binding = "DUNYA"
database_name = "tarpovizyon-dunya"
database_id = "e022515c-86ea-4f18-808a-0ea9ca3c79b3"
