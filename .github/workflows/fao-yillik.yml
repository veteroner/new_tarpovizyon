name: FAO yıllık veri setleri → D1

# FAO bu veri setlerini yılda birkaç kez güncelliyor (arazi örtüsü, pestisit ve
# gübre 2026'da temmuz sonunda çıktı). Günlük bakmak gereksiz; haftada bir
# yeterli. İş idempotent: yalnızca D1'deki son yıldan SONRAKİ yılları yazıyor,
# yeni yıl yoksa hiçbir şey yapmıyor.
#
# ─── NEDEN GÜNLÜK TÜİK İŞİNDE DEĞİL ─────────────────────────────────────────
# Bulk zip'ler 1-3 MB ve ayrıştırma yüz binlerce satır; günlük TÜİK senkronunu
# gereksiz yere uzatır. FAO gıda fiyat ENDEKSİ (aylık) ayrı ve o tuik-sync
# içinde kalmaya devam ediyor.

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      yaz:
        description: "D1'e yaz (kapalıysa sadece rapor)"
        type: boolean
        default: true

concurrency:
  group: fao-yillik
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Betik zip açmak için `unzip` kullanıyor; ubuntu-latest'te kurulu geliyor.
      - name: Senkronu çalıştır
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/fao-sync/sync.mjs \
            ${{ (github.event_name == 'schedule' || inputs.yaz) && '--yaz' || '' }}
