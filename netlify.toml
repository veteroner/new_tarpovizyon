# pro.tarpovizyon.com'un (Netlify sitesi: newtarpovizyon) TEK derleme
# yapılandırması. Kök uygulama build edilir: base satırı YOK, Netlify UI'daki
# base ayarı da boş (kök) ve depoda başka netlify.toml kalmadı — eski
# netlify-dashboard/ kopyası 2026-08-21'de tamamen silindi.
#
# command neden build:netlify: kökteki `npm run build`, git'te olmayan "tarpol
# rasyon mobil" submodülüne bağımlı rasyon-embed adımını çalıştırır ve CI'da
# kırılır; /rasyon/ varlıkları zaten public/rasyon/ altında commit'li.
# Netlify UI'daki build command hâlâ `npm run build` yazıyor; çakışmada bu
# dosya kazanıyor, yani aşağıdaki satır yükü taşıyor — silmeyin.
#
# Doğrulama yapılandırma okuyarak değil ÖLÇEREK yapılır: canlıda
# /manifest.webmanifest 200 dönüyorsa kök uygulama yayında.
[build]
  publish = "dist"
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"

# AI Chat → Netlify Function (Gemini öncelik, Groq fallback).
# Anahtarlar env'de: TARPOL_AI_KEY (Gemini), TARPOL_GROQ_KEY (Groq).
# Bu kural, aşağıdaki genel /api.php kuralından ÖNCE gelmeli: yalnızca
# action=ai_chat isteği function'a gider, diğer tüm action'lar dersbende.com'a.
[[redirects]]
  from = "/api.php"
  query = { action = "ai_chat" }
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api.php"
  to = "https://dersbende.com/api.php"
  status = 200
  force = true

[[redirects]]
  from = "/egg-prices"
  to = "https://basmakcitavukculuk.com/"
  status = 200
  force = true

[[redirects]]
  from = "/egg-prices-image"
  to = "https://basmakcitavukculuk.com/indexyumurta.php"
  status = 200
  force = true

[[redirects]]
  from = "/yahoo-proxy/*"
  to = "https://query1.finance.yahoo.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/fao/*"
  to = "https://fpma.fao.org/giews/v4/global/price_module/api/v1/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
