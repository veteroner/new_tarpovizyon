# Kök uygulama build edilir (netlify-dashboard/ artık kullanılmıyor — TarpoVizyon
# Basic modülü yalnızca kök src/'de). build:netlify, git'te olmayan "tarpol rasyon
# mobil" submodülüne bağımlı rasyon-embed adımını atlar; /rasyon/ varlıkları zaten
# public/rasyon/ altında commit'li.
[build]
  publish = "dist"
  command = "npm run build:netlify"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  directory = "netlify/functions"

# AI Chat → Netlify Function (Gemini öncelik, Groq fallback).
# Anahtarlar env'de: TARPOL_AI_KEY (Gemini), TARPOL_GROQ_KEY (Groq).
# Bu kural, aşağıdaki genel /api.php kuralından ÖNCE gelmeli: yalnızca
# action=ai_chat isteği function'a gider, diğer tüm action'lar dersbende.com'a.
[[redirects]]
  from = "/api.php"
  query = { action = "ai_chat" }
  to = "/.netlify/functions/ai-chat"
  status = 200
  force = true

[[redirects]]
  from = "/api.php"
  to = "https://dersbende.com/api.php"
  status = 200
  force = true

[[redirects]]
  from = "/egg-prices"
  to = "https://basmakcitavukculuk.com/"
  status = 200
  force = true

[[redirects]]
  from = "/egg-prices-image"
  to = "https://basmakcitavukculuk.com/indexyumurta.php"
  status = 200
  force = true

[[redirects]]
  from = "/yahoo-proxy/*"
  to = "https://query1.finance.yahoo.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/fao/*"
  to = "https://fpma.fao.org/giews/v4/global/price_module/api/v1/:splat"
  status = 200
  force = true

# ══════════════════════════════════════════════════════════════════════════
# ESKİ WIX ADRESLERİ → YENİ SAYFALAR
#
# tarpovizyon.com şu an Wix'te ve şu sayfaları yayınlıyor. Alan adı buraya
# taşınınca hepsi 404 olurdu; üstelik /tarpovizyon adresi tarpol.org.tr'nin
# ÜST MENÜSÜNDEN bağlı (ölçüldü) — kırılırsa vakıf sitesinden gelen ziyaretçi
# boşluğa düşer.
#
# `from` MUTLAK ADRES: kural yalnızca tarpovizyon.com ve www için geçerli.
# pro.tarpovizyon.com'a DOKUNMUYOR — Pro sürümü orada kullanılmaya devam
# edecek ve /tarpovizyon yolu orada çalışır kalmalı.
# ══════════════════════════════════════════════════════════════════════════

# /tarpovizyon → ana sayfa. (Bizim uygulamada /tarpovizyon YAYINLANMAMIŞ Pro
# seçim ekranı; yönlendirilmezse vakıf menüsü ziyaretçiyi doğrudan oraya
# sokar.)
[[redirects]]
  from = "https://tarpovizyon.com/tarpovizyon"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tarpovizyon.com/tarpovizyon"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "https://tarpovizyon.com/tarpovizyon/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.tarpovizyon.com/tarpovizyon/*"
  to = "/"
  status = 301
  force = true

# Wix'teki dört veri sayfası → karşılıkları
#
# ─── YOLLAR YÜZDE-KODLU YAZILDI ─────────────────────────────────────────────
# İlk hâlde çözülmüş biçim ("/tarımsal-makro-veriler") yazılmıştı ve CANLIDA
# ÇALIŞMADI: üçü de 301 yerine 200 döndü, yani SPA yakalama kuralına düştüler.
# Netlify eşleştirmeyi yolun HAM (kodlanmış) hâliyle yapıyor. Ölçülüp
# düzeltildi; her iki biçim de yazılı ki tarayıcı hangisini gönderirse
# göndersin yakalansın.
#
# "il" sayfasındaki i harfi Wix'te BİRLEŞTİRİCİ NOKTAYLA yazılmış
# (i + U+0307 → %69%CC%87), düz "i" değil. İkisi de kapsandı.

[[redirects]]
  from = "/tar%C4%B1msal-makro-veriler"
  to = "/tarpovizyon-basic/makro/genel"
  status = 301

[[redirects]]
  from = "/tarımsal-makro-veriler"
  to = "/tarpovizyon-basic/makro/genel"
  status = 301

[[redirects]]
  from = "/bikisel-%C3%BCretim"
  to = "/tarpovizyon-basic/bitkisel-genel/uretim-ozeti"
  status = 301

[[redirects]]
  from = "/bikisel-üretim"
  to = "/tarpovizyon-basic/bitkisel-genel/uretim-ozeti"
  status = 301

[[redirects]]
  from = "/hayvansal-%C3%BCretim"
  to = "/tarpovizyon-basic/genel/hayvansal-uretim"
  status = 301

[[redirects]]
  from = "/hayvansal-üretim"
  to = "/tarpovizyon-basic/genel/hayvansal-uretim"
  status = 301

[[redirects]]
  from = "/i%CC%87l-d%C3%BCzeyinde-sekt%C3%B6rel-veriler"
  to = "/tarpovizyon-basic/il-duzeyinde/bitkisel-uretim"
  status = 301

[[redirects]]
  from = "/il-d%C3%BCzeyinde-sekt%C3%B6rel-veriler"
  to = "/tarpovizyon-basic/il-duzeyinde/bitkisel-uretim"
  status = 301

[[redirects]]
  from = "/il-düzeyinde-sektörel-veriler"
  to = "/tarpovizyon-basic/il-duzeyinde/bitkisel-uretim"
  status = 301

# Wix'teki AI sayfası → yeni asistan
[[redirects]]
  from = "/tarpovizyon-ai"
  to = "/asistan"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
